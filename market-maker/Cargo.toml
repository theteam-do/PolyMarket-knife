[package]
name = "market-maker"
version.workspace = true
edition.workspace = true
description = "Market making strategy for Polymarket CLOB - production grade implementation"
license.workspace = true
repository.workspace = true
keywords = ["polymarket", "market-making", "trading", "clob"]
categories = ["development-tools", "finance"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
chrono.workspace = true
config.workspace = true
polymarket-client-sdk.workspace = true
alloy.workspace = true
monitor = { version = "0.1.0", path = "../monitor" }

[dev-dependencies]
mockall.workspace = true
tokio = { workspace = true, features = ["test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }
rust_decimal.workspace = true
rust_decimal_macros.workspace = true

[[test]]
name = "integration_test"
path = "../tests/integration_test.rs"

[[test]]
name = "e2e_test"
path = "../tests/e2e_test.rs"

[[bench]]
name = "order_book_bench"
harness = false
