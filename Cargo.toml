[workspace]
resolver = "2"

members = [
    "common",
    "monitor",
    "market-maker",
    "arbitrage",
    "follow-trade",
    "volatility-hunter",
    "info-edge",
    "order-attack",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PolyMarket Knife Team"]
license = "MIT"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP/WebSocket
reqwest = { version = "0.12", features = ["json", "stream"] }
tungstenite = "0.26"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 错误处理
thiserror = "2.0"
anyhow = "1.0"

# 并发
parking_lot = "0.12"
crossbeam = "0.8"

# 加密/区块链
ethers = { version = "2.0", features = ["ws", "abigen"] }
hex = "0.4"
sha3 = "0.10"
k256 = "0.13"

# 工具
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
chrono = "0.4"
regex = "1.11"
ordered-float = "4.6"
bytes = "1.10"

# 配置
config = "0.15"

# Futures
futures-util = "0.3"
async-trait = "0.1"

# 区块链 (官方 SDK 使用)
alloy = { version = "1.6", default-features = false, features = ["signer-local"] }
polymarket-client-sdk = { version = "0.4", default-features = false, features = ["clob", "ws", "tracing", "heartbeats"] }
uuid = { version = "1.6", features = ["serde", "v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
opt-level = 3
debug = false

# 测试依赖
[workspace.dependencies.mockall]
version = "0.14"
